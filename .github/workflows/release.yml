name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Trusted publishing: npm trades the job's OIDC token for a publish right on this repo and this
  # workflow alone, so no npm token is stored anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # npm publishes whatever package.json says, so a tag on the wrong commit would ship another
      # version under this tag's name.
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      # The tag is the release, so the gate runs again here rather than trusting that the commit
      # already went green on main: a tag can point anywhere.
      - run: npm run check

      - run: npm run lint

      - run: npm run test:unit -- --run

      # `prepack` builds dist and runs publint, so the tarball is packed from a fresh build.
      - run: npm publish --access public
