name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy is not worth racing: a newer commit should replace an older one on the site, so runs
# queue instead of cancelling, and the last one to finish is the last one pushed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      # The site is served from a project subpath, and BASE_PATH is the only place that is said.
      # `paths.base` in vite.config.ts reads it, `resolve()` applies it to every href, and local
      # builds leave it unset so dev and the end-to-end run keep the root.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
